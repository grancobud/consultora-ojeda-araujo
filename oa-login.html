<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Virtual | Ojeda Araujo & Asociados</title>
<meta name="description" content="Accede al campus virtual de Ojeda Araujo & Asociados. Cursos de agronegocios, cannabis medicinal, mercados de carbono y mas.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230F6E56'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' font-family='serif' font-weight='bold' fill='%23f0f4f0'%3EOA%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0F6E56">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --v: #0F6E56;
  --v2: #1D9E75;
  --v3: #085041;
  --v4: #5DCAA5;
  --negro: #080c0a;
  --oscuro: #0e1410;
  --card: #111813;
  --borde: #1c2620;
  --borde2: #2a3d33;
  --blanco: #f0f4f0;
  --gris: #7a8c80;
  --gris2: #aabfb0;
  --oro: #c9a84c;
  --oro2: #e8c97a;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--negro);
  color: var(--blanco);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  position: relative;
}

/* ─── GRAIN TEXTURE ─── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  opacity: .04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  pointer-events: none;
}

/* ─── AMBIENT GLOW ─── */
body::after {
  content: '';
  position: fixed;
  top: -30%;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 800px;
  background: radial-gradient(circle, rgba(15,110,86,.12) 0%, rgba(15,110,86,.04) 40%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ─── ANIMATIONS ─── */
@keyframes blink {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .4; transform: scale(1.5); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes slideRight {
  from { opacity: 0; transform: translateX(-12px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes slideLeft {
  from { opacity: 0; transform: translateX(12px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 20px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translate(-50%, 0); }
  to { opacity: 0; transform: translate(-50%, 20px); }
}

/* ─── BACK LINK ─── */
.back-link {
  position: fixed;
  top: 1.5rem;
  left: 2rem;
  z-index: 100;
  color: var(--gris);
  text-decoration: none;
  font-size: .8rem;
  letter-spacing: .06em;
  transition: color .3s;
  display: flex;
  align-items: center;
  gap: .5rem;
  animation: fadeUp .6s ease both;
}
.back-link:hover { color: var(--v4); }
.back-link svg { width: 16px; height: 16px; }

/* ─── MAIN WRAPPER ─── */
.login-wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  padding: 2rem 1.5rem;
  animation: fadeUp .7s ease both;
}

/* ─── CARD ─── */
.login-card {
  background: var(--card);
  border: 1px solid var(--borde2);
  border-radius: 4px;
  padding: 2.5rem 2.2rem 2rem;
  position: relative;
  box-shadow:
    0 0 60px rgba(15, 110, 86, .08),
    0 0 120px rgba(15, 110, 86, .04),
    0 20px 60px rgba(0, 0, 0, .4);
}

/* Subtle green glow on top border */
.login-card::before {
  content: '';
  position: absolute;
  top: -1px;
  left: 20%;
  right: 20%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--v2), var(--v4), var(--v2), transparent);
  border-radius: 2px;
  opacity: .7;
}

/* ─── LOGO HEADER ─── */
.logo-section {
  text-align: center;
  margin-bottom: 2rem;
}

.logo-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .6rem;
  margin-bottom: .8rem;
}

.logo-dot {
  width: 7px;
  height: 7px;
  background: var(--v4);
  border-radius: 50%;
  animation: blink 2.5s infinite;
  flex-shrink: 0;
}

.logo-text {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--blanco);
  letter-spacing: -.01em;
}

.logo-sub {
  font-size: .62rem;
  color: var(--gris);
  letter-spacing: .18em;
  text-transform: uppercase;
  margin-top: .2rem;
}

.logo-divider {
  width: 44px;
  height: 2px;
  background: linear-gradient(90deg, var(--oro), transparent);
  margin: 1.2rem auto 0;
}

/* ─── TABS ─── */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--borde);
  margin-bottom: 1.8rem;
}

.tab {
  flex: 1;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--gris);
  font-family: 'Outfit', sans-serif;
  font-size: .78rem;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: .85rem 0;
  cursor: pointer;
  transition: all .3s ease;
  position: relative;
}

.tab:hover { color: var(--gris2); }

.tab.active {
  color: var(--v4);
  border-bottom-color: var(--v4);
}

/* ─── FORM PANELS ─── */
.panels {
  position: relative;
  overflow: hidden;
}

.panel {
  display: none;
  flex-direction: column;
  gap: .9rem;
}

.panel.active {
  display: flex;
  animation: slideRight .35s ease both;
}

.panel.slide-left {
  animation: slideLeft .35s ease both;
}

/* ─── INPUTS ─── */
.field { position: relative; }

.field label {
  display: block;
  font-size: .68rem;
  color: var(--gris);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: .4rem;
  font-weight: 500;
}

.field input {
  width: 100%;
  background: var(--oscuro);
  border: 1px solid var(--borde);
  border-radius: 2px;
  padding: .8rem 1rem;
  color: var(--blanco);
  font-family: 'Outfit', sans-serif;
  font-size: .88rem;
  outline: none;
  transition: border-color .3s, box-shadow .3s;
}

.field input::placeholder {
  color: var(--gris);
  font-weight: 300;
}

.field input:focus {
  border-color: var(--v2);
  box-shadow: 0 0 0 3px rgba(29, 158, 117, .1);
}

.field input.error {
  border-color: #a63d40;
  box-shadow: 0 0 0 3px rgba(166, 61, 64, .1);
}

/* Toggle password visibility */
.field .toggle-pw {
  position: absolute;
  right: .8rem;
  bottom: .7rem;
  background: none;
  border: none;
  color: var(--gris);
  cursor: pointer;
  font-size: .85rem;
  transition: color .2s;
  padding: .2rem;
  line-height: 1;
}
.field .toggle-pw:hover { color: var(--v4); }

/* ─── BUTTONS ─── */
.btn-primary {
  width: 100%;
  background: var(--v);
  color: var(--blanco);
  border: 1px solid var(--v2);
  border-radius: 2px;
  padding: .9rem 1.5rem;
  font-family: 'Outfit', sans-serif;
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .3s ease;
  margin-top: .6rem;
  position: relative;
  overflow: hidden;
}

.btn-primary:hover {
  background: var(--v2);
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(15, 110, 86, .3);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-primary:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* Loading state */
.btn-primary.loading {
  color: transparent;
  pointer-events: none;
}

.btn-primary.loading::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 18px;
  height: 18px;
  margin: -9px 0 0 -9px;
  border: 2px solid rgba(240, 244, 240, .3);
  border-top-color: var(--blanco);
  border-radius: 50%;
  animation: spin .6s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ─── FORGOT PASSWORD ─── */
.forgot-link {
  text-align: center;
  margin-top: .3rem;
}

.forgot-link a {
  color: var(--gris);
  text-decoration: none;
  font-size: .76rem;
  transition: color .3s;
}

.forgot-link a:hover { color: var(--v4); }

/* ─── DIVIDER ─── */
.form-divider {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin: .4rem 0;
  color: var(--gris);
  font-size: .68rem;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.form-divider::before,
.form-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--borde);
}

/* ─── FORGOT PASSWORD VIEW ─── */
.forgot-view {
  display: none;
  flex-direction: column;
  gap: .9rem;
}

.forgot-view.active {
  display: flex;
  animation: slideLeft .35s ease both;
}

.forgot-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  font-weight: 400;
  text-align: center;
  margin-bottom: .2rem;
}

.forgot-desc {
  color: var(--gris2);
  font-size: .82rem;
  text-align: center;
  line-height: 1.7;
  font-weight: 300;
  margin-bottom: .4rem;
}

.forgot-back {
  text-align: center;
  margin-top: .5rem;
}

.forgot-back a {
  color: var(--gris);
  text-decoration: none;
  font-size: .76rem;
  transition: color .3s;
}

.forgot-back a:hover { color: var(--v4); }

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  background: var(--card);
  border: 1px solid var(--borde2);
  border-radius: 3px;
  padding: .85rem 1.5rem;
  font-size: .82rem;
  color: var(--blanco);
  max-width: 420px;
  width: 90%;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
  animation: toastIn .35s ease both;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .6rem;
  line-height: 1.5;
}

.toast.success { border-color: var(--v2); }
.toast.success .toast-icon { color: var(--v4); }

.toast.error { border-color: #a63d40; }
.toast.error .toast-icon { color: #e66; }

.toast.info { border-color: var(--oro); }
.toast.info .toast-icon { color: var(--oro); }

.toast.hiding { animation: toastOut .3s ease both; }

.toast-icon { font-size: 1rem; flex-shrink: 0; }

/* ─── FOOTER LINE ─── */
.footer-text {
  text-align: center;
  margin-top: 1.5rem;
  color: var(--gris);
  font-size: .68rem;
  letter-spacing: .05em;
  animation: fadeUp .8s ease .2s both;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 480px) {
  .login-wrapper { padding: 1.2rem 1rem; }
  .login-card { padding: 2rem 1.5rem 1.5rem; }
  .logo-text { font-size: 1.05rem; }
  .back-link { top: 1rem; left: 1rem; font-size: .75rem; }
}

@media (max-height: 700px) {
  body { align-items: flex-start; padding-top: 3.5rem; }
}
</style>
</head>
<body>

<!-- Back link -->
<a href="index.html" class="back-link">

<script>
// ─── SUPABASE ───
const SUPABASE_URL = 'https://zhdcwcpitegxmewxvqcl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Jt-be16ffF0GgG0pdNFlnw_yrF0kpko';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── CHECK AUTH ───
(async function checkAuth() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = 'oa-campus.html';
  } catch (e) {
    // Not logged in, stay on page
  }
})();

// ─── TAB SWITCHING ───
function switchTab(tab) {
  // Update tab buttons
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');

  // Hide forgot view if visible
  document.getElementById('forgot-view').classList.remove('active');
  document.getElementById('panels').style.display = '';

  // Switch panels
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active', 'slide-left'));

  const target = document.getElementById(`panel-${tab}`);
  if (tab === 'register') {
    target.classList.add('active', 'slide-left');
  } else {
    target.classList.add('active');
  }
}

// ─── FORGOT PASSWORD VIEW ───
function showForgot(e) {
  e.preventDefault();
  document.getElementById('panels').style.display = 'none';
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('forgot-view').classList.add('active');
}

function hideForgot(e) {
  e.preventDefault();
  document.getElementById('forgot-view').classList.remove('active');
  document.getElementById('panels').style.display = '';
  document.getElementById('tabs').style.display = '';
}

// ─── TOGGLE PASSWORD VISIBILITY ───
function togglePw(btn) {
  const input = btn.previousElementSibling;
  const isPassword = input.type === 'password';
  input.type = isPassword ? 'text' : 'password';

  // Swap icon
  if (isPassword) {
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  } else {
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }
}

// ─── SET LOADING STATE ───
function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) {
    btn.classList.add('loading');
    btn.disabled = true;
  } else {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

// ─── TOAST NOTIFICATIONS ───
let toastTimer = null;

function showToast(message, type = 'info') {
  // Remove existing toast
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  if (toastTimer) clearTimeout(toastTimer);

  const icons = {
    success: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
  };

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span class="toast-icon">${icons[type] || icons.info}</span><span>${message}</span>`;
  document.body.appendChild(toast);

  toastTimer = setTimeout(() => {
    toast.classList.add('hiding');
    setTimeout(() => toast.remove(), 300);
  }, 4500);
}

// ─── LOGIN HANDLER ───
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pw').value;

  if (!email || !password) {
    showToast('Completa todos los campos.', 'error');
    return;
  }

  setLoading('btn-login', true);

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    showToast('Bienvenido! Redirigiendo...', 'success');
    setTimeout(() => { window.location.href = 'oa-campus.html'; }, 800);
  } catch (err) {
    const msg = translateError(err.message);
    showToast(msg, 'error');
    setLoading('btn-login', false);
  }
}

// ─── REGISTER HANDLER ───
async function handleRegister(e) {
  e.preventDefault();
  const nombre = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-pw').value;
  const password2 = document.getElementById('reg-pw2').value;

  if (!nombre || !email || !password || !password2) {
    showToast('Completa todos los campos.', 'error');
    return;
  }

  if (password !== password2) {
    showToast('Las contrasenas no coinciden.', 'error');
    document.getElementById('reg-pw2').classList.add('error');
    setTimeout(() => document.getElementById('reg-pw2').classList.remove('error'), 2000);
    return;
  }

  if (password.length < 6) {
    showToast('La contrasena debe tener al menos 6 caracteres.', 'error');
    return;
  }

  setLoading('btn-register', true);

  try {
    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: { data: { nombre } }
    });
    if (error) throw error;

    showToast('Cuenta creada. Revisa tu email para confirmar tu cuenta.', 'success');

    // Clear form
    document.getElementById('panel-register').reset();
    setLoading('btn-register', false);
  } catch (err) {
    const msg = translateError(err.message);
    showToast(msg, 'error');
    setLoading('btn-register', false);
  }
}

// ─── FORGOT PASSWORD HANDLER ───
async function handleForgot(e) {
  e.preventDefault();
  const email = document.getElementById('forgot-email').value.trim();

  if (!email) {
    showToast('Ingresa tu email.', 'error');
    return;
  }

  setLoading('btn-forgot', true);

  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/oa-login.html'
    });
    if (error) throw error;

    showToast('Enlace enviado. Revisa tu bandeja de entrada.', 'success');
    setLoading('btn-forgot', false);
  } catch (err) {
    const msg = translateError(err.message);
    showToast(msg, 'error');
    setLoading('btn-forgot', false);
  }
}

// ─── ERROR TRANSLATION ───
function translateError(msg) {
  const map = {
    'Invalid login credentials': 'Email o contrasena incorrectos.',
    'Email not confirmed': 'Tu email aun no fue confirmado. Revisa tu bandeja.',
    'User already registered': 'Este email ya esta registrado.',
    'Signup requires a valid password': 'La contrasena no es valida.',
    'Unable to validate email address: invalid format': 'El formato del email no es valido.',
    'Password should be at least 6 characters': 'La contrasena debe tener al menos 6 caracteres.',
    'For security purposes, you can only request this once every 60 seconds': 'Por seguridad, espera 60 segundos antes de intentar nuevamente.',
    'Email rate limit exceeded': 'Demasiados intentos. Espera un momento.',
  };
  return map[msg] || msg || 'Ocurrio un error. Intenta nuevamente.';
}

// ─── ENTER KEY NAVIGATION ───
document.querySelectorAll('input').forEach(input => {
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const form = input.closest('form');
      if (form) {
        const inputs = Array.from(form.querySelectorAll('input'));
        const idx = inputs.indexOf(input);
        if (idx < inputs.length - 1) {
          e.preventDefault();
          inputs[idx + 1].focus();
        }
        // Last input: let the form submit naturally
      }
    }
  });
});
</script>
