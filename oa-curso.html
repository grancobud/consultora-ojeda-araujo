*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

/* Animations */

/* Breadcrumb */
.breadcrumb{padding:1rem 5rem;background:var(--oscuro);border-bottom:1px solid var(--borde);margin-top:60px;}

/* Responsive */

  nav{padding:1.1rem 2.5rem;}

  .cta-btns a{width:100%;max-width:320px;justify-content:center;text-align:center;}

        var compraRes = await sb.from('compras').select('id')
          .eq('user_id', session.user.id).eq('curso_id', cursoId).single();
        purchased = !!(compraRes.data);
      } catch(e) { /* no purchase table or no purchase */ }
    }

    renderCourse(curso, related, purchased, session);
  } catch(err) {
    console.error('Error loading course:', err);
    window.location.href = 'index.html#cursos';
  }
}

/* ===== RENDER ===== */

  var leftCol = '<div>' +

    '<ul class="learn-list">' + learnHtml + '</ul></div>' +
    '<div class="detail-block fu" style="transition-delay:.1s">' +

    '<div class="modality-item"><div class="modality-icon">\u267E\uFE0F</div>Acceso permanente al contenido</div>' +
    '<div class="modality-item"><div class="modality-icon">\uD83D\uDCC4</div>Materiales PDF descargables</div>' +

    '<h3>Duraci\u00f3n</h3>' +
    '<p style="color:var(--gris2);font-size:.92rem;font-weight:300;">' + duracionText + '</p></div>' +

  /* Sticky card right */

    }).join('');

    relatedSection = '<div class="divline"></div><section><div class="wrap">' +
      '<div class="eyebrow fu">Seguir explorando</div>' +

      '<div class="goldbar fu"></div>' +
      '<div class="related-grid" style="margin-top:2.5rem;">' + relCards + '</div>' +

  }

  /* CTA */
  var ctaBuyBtn = '';
  if (purchased) {
    ctaBuyBtn = '<a href="oa-campus.html" class="btn-campus">Ir al Campus &rarr;</a>';
  } else if (curso.mp_link && curso.mp_link.length > 5) {
    ctaBuyBtn = '<a href="' + curso.mp_link + '" target="_blank" class="btn-oro">Comprar ' + curso.nombre.split(':')[0].split(' \u2014 ')[0].substring(0, 40) + ' &rarr;</a>';
  } else {
    ctaBuyBtn = '<a href="' + WA_CURSO(curso.nombre) + '" target="_blank" class="btn-oro">Consultar &rarr;</a>';
  }

  /* Init scroll animations */
  initAnimations();

  /* Hide loading */
  document.getElementById('loading-screen').classList.add('hidden');

/* ===== ANIMATIONS ===== */
function initAnimations() {
  var obs = new IntersectionObserver(function(entries, observer) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        e.target.classList.add('vis');
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.fu').forEach(function(el) {
    obs.observe(el);
  });
}

/* ===== START ===== */
window.addEventListener('DOMContentLoaded', function() {
  init();
});
